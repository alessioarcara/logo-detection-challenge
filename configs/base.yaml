seed: 42
device: cuda

wandb_entity: aarcara
wandb_project: eyecan
wandb_run_name: aggressive_augmentation

num_epochs: 100
eval_freq: 1
image_size: 518

use_mixed_precision: true

mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

generator_config:
  logos_dir: "data/training/logos"
  backgrounds_dir: "data/training/backgrounds"
  output_size:
    - ${image_size}
    - ${image_size}
  length: 10000
  negative_ratio: 0.1
  seed: 42
  max_retries: 10
  blends:
    - _target_type_: ./src/generator/blends.py:AlphaBlend
      _init_args_: {}
    - _target_type_: ./src/generator/blends.py:GaussianBlend
      _init_args_:
        sigma: 2.0
  same_scene_blend_variants: true

  logo_transform:
    _target_type_: albumentations:Compose
    _init_args_:
      transforms:
        - _target_type_: albumentations:LongestMaxSize
          _init_args_:
            max_size: ${image_size}
        - _target_type_: albumentations:Affine
          _init_args_:
            scale: [0.05, 0.7]
            rotate: [-180, 180]
            shear: [-45, 45]
            translate_percent:
              x: [-0.5, 0.5]
              y: [-0.5, 0.5]
            border_mode: 0
            fill: 0
            p: 1.0
        - _target_type_: albumentations:Perspective
          _init_args_:
            scale: [0.2, 0.5]
            keep_size: true
            border_mode: 0
            fill: 0
            p: 0.7
        - _target_type_: albumentations:HueSaturationValue
          _init_args_:
            hue_shift_limit: 180
            sat_shift_limit: [-5, 80]
            val_shift_limit: [-30, 50]
            p: 1.0
        - _target_type_: albumentations:OneOf
          _init_args_:
            transforms:
              - _target_type_: albumentations:RGBShift
                _init_args_:
                  r_shift_limit: 80
                  g_shift_limit: 80
                  b_shift_limit: 80
                  p: 1.0
              - _target_type_: albumentations:ChannelShuffle
                _init_args_:
                  p: 1.0
              - _target_type_: albumentations:ColorJitter
                _init_args_:
                  brightness: 0.4
                  contrast: 0.4
                  saturation: 0.8
                  hue: 0.5
                  p: 1.0
            p: 0.8
        - _target_type_: albumentations:ToGray
          _init_args_:
            p: 0.05
        - _target_type_: albumentations:OneOf
          _init_args_:
            transforms:
              - _target_type_: albumentations:RandomGamma
                _init_args_:
                  gamma_limit: [70, 140]
                  p: 1.0
              - _target_type_: albumentations:RandomBrightnessContrast
                _init_args_:
                  brightness_limit: 0.35
                  contrast_limit: 0.35
                  p: 1.0
            p: 0.35
      keypoint_params:
        _target_type_: albumentations:KeypointParams
        _init_args_:
          format: xy
          remove_invisible: true

  composition_transform:
    _target_type_: albumentations:Compose
    _init_args_:
      transforms: []
      bbox_params:
        _target_type_: albumentations:BboxParams
        _init_args_:
          format: coco
          min_visibility: 0.3
          label_fields: [labels]
      keypoint_params:
        _target_type_: albumentations:KeypointParams
        _init_args_:
          format: xy
          remove_invisible: true

generator:
  _target_type_: ./src/generator/generator.py:LogoDatasetGenerator
  _init_args_:
    config: ${generator_config}

train_loader:
  _target_type_: torch.utils.data:DataLoader
  _init_args_:
    dataset:
      _target_type_: ./src/data.py:DetectionDataset
      _init_method_: from_sequence
      _init_args_:
        sequence: ${generator.as_sequence()}
        transform:
          _target_type_: albumentations:Compose
          _init_args_:
            transforms:
              - _target_type_: albumentations:OneOf
                _init_args_:
                  transforms:
                    - _target_type_: albumentations:GaussianBlur
                      _init_args_:
                        sigma_limit: [0.5, 2.0]
                    - _target_type_: albumentations:MotionBlur
                      _init_args_:
                        blur_limit: [3, 7]
                  p: 0.3
              - _target_type_: albumentations:GaussNoise
                _init_args_:
                  std_range: [0.1, 0.3]
                  p: 0.2
              - _target_type_: albumentations:ImageCompression
                _init_args_:
                  quality_range: [40, 90]
                  p: 0.3
              - _target_type_: albumentations:Downscale
                _init_args_:
                  scale_range: [0.5, 0.9]
                  p: 0.2
              - _target_type_: albumentations:CoarseDropout
                _init_args_:
                  num_holes_range: [1, 5]
                  hole_height_range: [0.02, 0.1]
                  hole_width_range: [0.02, 0.1]
                  fill: 0
                  p: 0.3
              - _target_type_: albumentations:Normalize
                _init_args_: {}
              - _target_type_: albumentations:ToTensorV2
                _init_args_: {}
    batch_size: 64
    shuffle: true
    num_workers: 15
    pin_memory: true
    persistent_workers: true
    collate_fn:
      _target_type_: ./src/data.py:DetectionCollateFn
      _init_args_: {}

val_loader:
  _target_type_: torch.utils.data:DataLoader
  _init_args_:
    dataset:
      _target_type_: ./src/data.py:DetectionDataset
      _init_method_: from_underfolder
      _init_args_:
        folder: "data/validation"
        transform:
          _target_type_: albumentations:Compose
          _init_args_:
            transforms:
              - _target_type_: albumentations:Resize
                _init_args_:
                  height: ${image_size}
                  width: ${image_size}
              - _target_type_: albumentations:Normalize
                _init_args_: {}
              - _target_type_: albumentations:ToTensorV2
                _init_args_: {}
    batch_size: 66
    shuffle: false
    num_workers: 4
    pin_memory: true
    collate_fn:
      _target_type_: ./src/data.py:DetectionCollateFn
      _init_args_: {}

optim:
  _target_type_: torch.optim:AdamW
  _init_args_:
    params: ${model.parameters()}
    lr: 1.0e-4
    weight_decay: 1.0e-2

scheduler:
  _target_type_: torch.optim.lr_scheduler:CosineAnnealingLR
  _init_args_:
    optimizer: ${optim}
    T_max: ${num_epochs}

vit_config:
  img_size: ${image_size}
  patch_size: 14
  in_channels: 3
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  ls_init_value: 1.0e-6
  num_register_tokens: 4

model:
  _target_type_: ./src/models/detector.py:Detector
  _init_args_:
    backbone:
      _target_type_: ./src/models/vit.py:VisionTransformer
      _init_method_: from_pretrained
      _init_args_:
        cfg: ${vit_config}
        checkpoint_path: "checkpoints/dinov2_vitb14_reg4_pretrain.pth"
    freeze_backbone: true
    neck_features: 256
    layer_indices: [5, 11] # 3, 6, 9, 12
    reassemble_scales: [2.0, 0.5]
    head_dropout: 0.3
    checkpoint: checkpoints/aggressive_augmentation_val-localization_accuracy=0.8939.pth

metrics:
  _target_type_: ./src/training/metrics.py:MetricCollection
  _init_args_:
    metrics:
      - _target_type_: ./src/training/metrics.py:LocalizationAccuracy
        _init_args_: {}
      - _target_type_: ./src/training/metrics.py:MeanAbsoluteError
        _init_args_: {}
      - _target_type_: ./src/training/metrics.py:LogoPresenceAccuracy
        _init_args_:
          threshold: 0.1

callbacks:
  - _target_type_: ./src/training/callbacks.py:ModelSavingCallback
    _init_args_:
      save_dir: "checkpoints"
      history_key: val/localization_accuracy
      minimize: false
  - _target_type_: ./src/training/callbacks.py:EarlyStoppingCallback
    _init_args_:
      history_key: val/localization_accuracy
      minimize: false
      patience: 20
  - _target_type_: ./src/training/callbacks.py:VisualizeCallback
    _init_args_:
      stage: train
      mean: ${mean}
      std: ${std}
      num_samples: 16
      objectness_threshold: 0.5
  - _target_type_: ./src/training/callbacks.py:VisualizeCallback
    _init_args_:
      stage: val
      mean: ${mean}
      std: ${std}
      num_samples: 64
      objectness_threshold: 0.3

criterion:
  _target_type_: ./src/training/losses.py:HeatmapLoss
  _init_args_:
    sigma: 0.05
    alpha: 2.0
    beta: 4.0
