seed: 42
device: cuda

wandb_entity: aarcara
wandb_project: eyecan
wandb_run_name: test

num_epochs: 100
eval_freq: 1
image_size: 518

use_mixed_precision: true
compile_model: false

generator_config:
  logos_dir: "data/training/logos"
  backgrounds_dir: "data/training/backgrounds"
  output_size:
    - ${image_size}
    - ${image_size}
  length: 1000
  negative_ratio: 0.2
  seed: 42
  max_retries: 10
  blends:
    - _target_type_: ./src/generator/blends.py:AlphaBlend
      _init_args_: {}
    - _target_type_: ./src/generator/blends.py:GaussianBlend
      _init_args_:
        sigma: 2.0
  same_scene_blend_variants: true

  logo_transform:
    _target_type_: albumentations:Compose
    _init_args_:
      transforms:
        - _target_type_: albumentations:LongestMaxSize
          _init_args_:
            max_size: ${image_size}
        - _target_type_: albumentations:Affine
          _init_args_:
            scale: [0.2, 0.7]
            rotate: [-180, 180]
            shear: [-30, 30]
            translate_percent:
              x: [-0.5, 0.5]
              y: [-0.5, 0.5]
            border_mode: 0
            fill: 0
            p: 1.0
        - _target_type_: albumentations:Perspective
          _init_args_:
            scale: [0.05, 0.20]
            keep_size: true
            border_mode: 0
            fill: 0
            p: 0.7
        - _target_type_: albumentations:HueSaturationValue
          _init_args_:
            hue_shift_limit: 180
            sat_shift_limit: [-5, 80]
            val_shift_limit: [-30, 50]
            p: 1.0
        - _target_type_: albumentations:OneOf
          _init_args_:
            transforms:
              - _target_type_: albumentations:RGBShift
                _init_args_:
                  r_shift_limit: 80
                  g_shift_limit: 80
                  b_shift_limit: 80
                  p: 1.0
              - _target_type_: albumentations:ChannelShuffle
                _init_args_:
                  p: 1.0
              - _target_type_: albumentations:ColorJitter
                _init_args_:
                  brightness: 0.4
                  contrast: 0.4
                  saturation: 0.8
                  hue: 0.5
                  p: 1.0
            p: 0.8
        - _target_type_: albumentations:ToGray
          _init_args_:
            p: 0.05
        - _target_type_: albumentations:OneOf
          _init_args_:
            transforms:
              - _target_type_: albumentations:RandomGamma
                _init_args_:
                  gamma_limit: [70, 140]
                  p: 1.0
              - _target_type_: albumentations:RandomBrightnessContrast
                _init_args_:
                  brightness_limit: 0.35
                  contrast_limit: 0.35
                  p: 1.0
            p: 0.35
      keypoint_params:
        _target_type_: albumentations:KeypointParams
        _init_args_:
          format: xy
          remove_invisible: true

  composition_transform:
    _target_type_: albumentations:Compose
    _init_args_:
      transforms: []
      bbox_params:
        _target_type_: albumentations:BboxParams
        _init_args_:
          format: coco
          min_visibility: 0.3
          label_fields: [labels]
      keypoint_params:
        _target_type_: albumentations:KeypointParams
        _init_args_:
          format: xy
          remove_invisible: true

generator:
  _target_type_: ./src/generator/generator.py:LogoDatasetGenerator
  _init_args_:
    config: ${generator_config}

train_loader:
  _target_type_: torch.utils.data:DataLoader
  _init_args_:
    dataset:
      _target_type_: ./src/data.py:DetectionDataset
      _init_method_: from_sequence
      _init_args_:
        sequence: ${generator.as_sequence()}
        transform:
          _target_type_: albumentations:Compose
          _init_args_:
            transforms:
              - _target_type_: albumentations:Normalize
                _init_args_: {}
              - _target_type_: albumentations:ToTensorV2
                _init_args_: {}
    batch_size: 128
    shuffle: true
    num_workers: 15
    pin_memory: true
    persistent_workers: true
    collate_fn:
      _target_type_: ./src/data.py:DetectionCollateFn
      _init_args_: {}

val_loader:
  _target_type_: torch.utils.data:DataLoader
  _init_args_:
    dataset:
      _target_type_: ./src/data.py:DetectionDataset
      _init_method_: from_underfolder
      _init_args_:
        folder: "data/validation"
        transform:
          _target_type_: albumentations:Compose
          _init_args_:
            transforms:
              - _target_type_: albumentations:Resize
                _init_args_:
                  height: ${image_size}
                  width: ${image_size}
                  interpolation: 1
              - _target_type_: albumentations:Normalize
                _init_args_: {}
              - _target_type_: albumentations:ToTensorV2
                _init_args_: {}
    batch_size: 66
    shuffle: false
    num_workers: 4
    pin_memory: true
    collate_fn:
      _target_type_: ./src/data.py:DetectionCollateFn
      _init_args_: {}

optim:
  _target_type_: torch.optim:AdamW
  _init_args_:
    params: ${model.parameters()}
    lr: 1.0e-3
    weight_decay: 0.0

scheduler:
  _target_type_: torch.optim.lr_scheduler:CosineAnnealingLR
  _init_args_:
    optimizer: ${optim}
    T_max: ${num_epochs}

vit_config:
  img_size: ${image_size}
  patch_size: 14
  in_channels: 3
  embed_dim: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  ls_init_value: 1.0e-6
  num_register_tokens: 4

model:
  _target_type_: ./src/models/detector.py:Detector
  _init_args_:
    backbone:
      _target_type_: ./src/models/vit.py:VisionTransformer
      _init_method_: from_pretrained
      _init_args_:
        cfg: ${vit_config}
        checkpoint_path: "checkpoints/dinov2_vits14_reg4_pretrain.pth"
    freeze_backbone: true

metrics:
  _target_type_: ./src/training/metrics.py:MetricCollection
  _init_args_:
    metrics:
      - _target_type_: ./src/training/metrics.py:LocalizationAccuracy
        _init_args_: {}
      - _target_type_: ./src/training/metrics.py:MeanAbsoluteError
        _init_args_: {}
      - _target_type_: ./src/training/metrics.py:LogoPresenceAccuracy
        _init_args_: {}

callbacks:
  - _target_type_: ./src/training/callbacks.py:ModelSavingCallback
    _init_args_:
      save_dir: "checkpoints"
      history_key: val/loss
      minimize: true
  - _target_type_: ./src/training/callbacks.py:EarlyStoppingCallback
    _init_args_:
      history_key: val/loss
      minimize: true
      patience: 10
  - _target_type_: ./src/training/callbacks.py:VisualizeCallback
    _init_args_:
      stage: train
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      num_samples: 8
      objectness_threshold: 0.5
  - _target_type_: ./src/training/callbacks.py:VisualizeCallback
    _init_args_:
      stage: val
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      num_samples: 8
      objectness_threshold: 0.5

criterion:
  _target_type_: ./src/training/losses.py:LogoLoss
  _init_args_:
    keypoint_loss:
      _target_type_: torch.nn:MSELoss
      _init_args_: {}
